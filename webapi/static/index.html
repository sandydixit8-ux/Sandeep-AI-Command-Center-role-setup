<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandeep AI Command Center</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e9ef; --muted:#8a93a6; --accent:#4f8cff; --ok:#3fb98a; --err:#e55b6d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; }
    header h1 { font-size:18px; margin:0; }
    header .sub { color:var(--muted); font-size:12px; }
    main { max-width:860px; margin:0 auto; padding:20px 16px 120px; }
    .controls { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    select, textarea, button { font:inherit; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; }
    select { padding:10px 12px; }
    textarea { width:100%; min-height:90px; padding:12px; resize:vertical; }
    button { padding:10px 18px; cursor:pointer; background:var(--accent); border:none; font-weight:600; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    #log { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
    .msg { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px; white-space:pre-wrap; word-break:break-word; }
    .msg.meta { color:var(--muted); font-size:12px; }
    .msg.tool { border-left:3px solid var(--accent); }
    .msg.error { border-left:3px solid var(--err); }
    .msg.result { border-left:3px solid var(--ok); }
    .msg .tag { display:inline-block; font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.05em; }
    .msg .arg { color:var(--muted); font-size:12px; }
    .spinner { color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Sandeep AI Command Center</h1>
    <span class="sub">agents suite &middot; streaming</span>
  </header>
  <main>
    <div class="controls">
      <select id="agent" title="Agent"></select>
      <button id="runBtn">Run</button>
      <button id="clearBtn">Clear</button>
    </div>
    <textarea id="task" placeholder="Describe what you need... e.g. Record a 25 GBP expense and summarize this month"></textarea>
    <div id="log"></div>
  </main>

  <script>
    const agentSel = document.getElementById('agent');
    const taskEl = document.getElementById('task');
    const runBtn = document.getElementById('runBtn');
    const clearBtn = document.getElementById('clearBtn');
    const logEl = document.getElementById('log');

    function addMsg(type, text, meta) {
      const el = document.createElement('div');
      el.className = 'msg ' + type;
      if (type === 'tool_call') {
        el.className = 'msg tool';
        el.innerHTML = '<span class="tag">tool</span><br><b>' + esc(meta.name) + '</b><br><span class="arg">' + esc(meta.output || '') + '</span>';
      } else if (type === 'assistant') {
        el.innerHTML = '<span class="tag">thinking</span><br>' + esc(text);
      } else if (type === 'result') {
        el.innerHTML = '<span class="tag">result</span><br>' + esc(text);
      } else if (type === 'error') {
        el.innerHTML = '<span class="tag">error</span><br>' + esc(text);
      } else {
        el.className = 'msg meta';
        el.textContent = text;
      }
      logEl.appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return el;
    }

    function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    async function loadAgents() {
      const r = await fetch('/api/v1/agents');
      const agents = await r.json();
      agentSel.innerHTML = agents.map(a => '<option value="' + a.key + '">' + esc(a.label) + '</option>').join('');
    }

    async function run() {
      const agent = agentSel.value;
      const task = taskEl.value.trim();
      if (!task) return;
      runBtn.disabled = true;
      const metaEl = addMsg('meta', 'Running ' + agent + '...');

      try {
        const res = await fetch('/api/v1/run/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agent, task })
        });
        if (!res.ok || !res.body) {
          addMsg('error', 'Request failed: ' + res.status);
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n\n')) !== -1) {
            const chunk = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            if (!chunk.startsWith('data: ')) continue;
            let evt;
            try { evt = JSON.parse(chunk.slice(6)); } catch (e) { continue; }
            if (evt.type === 'meta') {
              metaEl.textContent = evt.label + ' (' + evt.agent + ')';
            } else if (evt.type === 'tool_call') {
              addMsg('tool_call', '', evt);
            } else if (evt.type === 'assistant') {
              addMsg('assistant', evt.text);
            } else if (evt.type === 'result') {
              addMsg('result', evt.text);
            } else if (evt.type === 'error') {
              addMsg('error', evt.text);
            }
          }
        }
      } catch (err) {
        addMsg('error', String(err));
      } finally {
        runBtn.disabled = false;
      }
    }

    runBtn.addEventListener('click', run);
    taskEl.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run(); });
    clearBtn.addEventListener('click', () => { logEl.innerHTML = ''; });
    loadAgents();
  </script>
</body>
</html>
